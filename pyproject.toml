[project]
name = "canet"
version = "0.1.0"
description = "CANet: ChronoAdaptive Network Network"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.8.0",
  "lightning>=2.3.3",
  "openpyxl>=3.1.5",
  "optuna>=3.6.1",
  "pandas>=2.2.2",
  "scikit-learn>=1.7.2",
  "setuptools>=82.0.1",
  "timm>=1.0.7",
  "torch>=2.3.1",
  "torchvision>=0.18.1",
]

[dependency-groups]
dev = ["ptflops>=0.7.4", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["canet", "config", "data", "evaluation", "forecasting", "utils"]

[tool.ruff.lint.per-file-ignores]
# Derived from Amazon GluonTS (Apache 2.0) — do not enforce project docstring style on it.
"data/timefeatures.py" = ["D", "ANN", "E402", "E501"]
# deprecated/ directory is not maintained — exclude from all checks.
"deprecated/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
