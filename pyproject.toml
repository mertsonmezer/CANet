[project]
name = "canet"
version = "0.1.0"
description = "CANet: ChronoAdaptive Network Network"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.8.0",
  "lightning>=2.3.3",
  "optuna>=3.6.1",
  "pandas>=2.2.2",
  "setuptools>=82.0.1",
  "timm>=1.0.7",
  "torch>=2.3.1",
  "torchvision>=0.18.1",
]

[dependency-groups]
dev = ["ptflops>=0.7.4"]
